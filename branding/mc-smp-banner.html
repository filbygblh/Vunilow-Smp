<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:2048px;height:1152px;overflow:hidden}
body{background:#0a0416;font-family:'DM Sans',system-ui,sans-serif}
.banner{position:relative;width:2048px;height:1152px}
.ground{position:absolute;left:0;right:0;bottom:0;height:48px;background-image:url(../mc/grass_block_side.png);background-size:48px 48px;background-repeat:repeat-x;image-rendering:pixelated;border-top:2px solid #1c1c1c}
.safe{position:absolute;left:406px;top:407px;width:1235px;height:338px;display:flex;align-items:center;justify-content:space-between;gap:70px}
.copy{display:flex;flex-direction:column;justify-content:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:9px 16px;border-radius:2px;
  border:2px solid #3a1d76;background:#210f45;color:#e2cbff;font-size:21px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.chip i{width:10px;height:10px;background:#6fb14b;display:block}
h1{margin:18px 0 12px;font-size:108px;line-height:.94;font-weight:800;letter-spacing:-.045em;color:#f4f4f4}
.sub{margin:0;font-size:29px;font-weight:500;color:#a6a6a6}
.sub b{color:#e8e8e8;font-weight:600}
.cube{--s:240px;position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-38deg);flex:0 0 auto}
.cube i{position:absolute;inset:0;display:block;background-size:100% 100%;image-rendering:pixelated}
.cube i.f,.cube i.r{background-image:url(../mc/amethyst_block.png)}
.cube i.t{background-image:url(../mc/amethyst_block.png)}
.cube i.f{transform:translateZ(calc(var(--s) / 2))}
.cube i.r{transform:rotateY(90deg) translateZ(calc(var(--s) / 2));filter:brightness(.72)}
.cube i.t{transform:rotateX(90deg) translateZ(calc(var(--s) / 2));filter:brightness(1.1)}
</style></head><body>
<div class="banner">
  <div class="ground"></div>
  <div class="safe">
    <div class="copy">
      <span class="chip"><i></i>Java + Bedrock</span>
      <h1>VUNILOW SMP</h1>
      <p class="sub"><b>Shop survival</b> · vunilowsmp.net</p>
    </div>
    <div class="cube"><i class="t"></i><i class="f"></i><i class="r"></i></div>
  </div>
</div>
</body></html>
