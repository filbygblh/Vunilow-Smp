<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:2048px;height:1152px;overflow:hidden}
body{background:#0e0e0e;font-family:'Inter',system-ui,sans-serif}
.banner{position:relative;width:2048px;height:1152px;overflow:hidden;
  background-image:url(../mc/stone.png);background-size:160px 160px;image-rendering:pixelated}
.shade{position:absolute;inset:0;background:linear-gradient(120deg,rgba(8,8,8,.92),rgba(8,8,8,.6) 58%,rgba(8,8,8,.82))}
.safe{position:absolute;left:406px;top:407px;width:1235px;height:338px;display:flex;align-items:center;justify-content:space-between;gap:70px;z-index:1}
.copy{display:flex;flex-direction:column;min-width:0}
.chip{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:9px 16px;
  border:2px solid #3a3a3a;background:#151515;color:#dcdcdc;font-size:21px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.chip i{width:10px;height:10px;background:#7ab648;display:block}
h1{margin:18px 0 12px;font-family:'Pixelify Sans',ui-monospace,monospace;font-size:116px;line-height:.98;font-weight:700;color:#f6f6f6}
.sub{margin:0;font-size:30px;font-weight:500;color:#a8a8a8}
.sub b{color:#eaeaea;font-weight:600}
.slot{position:relative;flex:0 0 auto;padding:12px;background:#0d0d0d;border:4px solid #2f2f2f;box-shadow:0 16px 0 rgba(0,0,0,.45)}
.slot img{display:block;width:300px;height:300px;object-fit:cover;image-rendering:pixelated;background:#111}
</style></head><body>
<div class="banner">
  <div class="shade"></div>
  <div class="safe">
    <div class="copy">
      <span class="chip"><i></i>Minecraft · Java + Bedrock</span>
      <h1>VUNILOW</h1>
      <p class="sub"><b>Shop survival streams</b> · VunilowSMP</p>
    </div>
    <div class="slot"><img src="skin/head-1024.png" alt=""></div>
  </div>
</div>
</body></html>
