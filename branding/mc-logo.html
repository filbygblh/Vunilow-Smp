<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:256px;height:256px;overflow:hidden}
body{background:#160932;display:grid;place-items:center}
.tile{width:256px;height:256px;box-sizing:border-box;border:4px solid #3a1d76;display:grid;place-items:center;box-shadow:inset 0 0 0 4px #0a0416}
svg{display:block;shape-rendering:crispEdges}
</style></head><body>
<div class="tile">
<svg width="144" height="144" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" fill="#b45cff">
<rect x="0" y="0" width="2" height="1"/><rect x="0" y="1" width="2" height="1"/>
<rect x="10" y="0" width="2" height="1"/><rect x="10" y="1" width="2" height="1"/>
<rect x="0" y="2" width="2" height="1"/><rect x="10" y="2" width="2" height="1"/>
<rect x="1" y="3" width="2" height="1"/><rect x="9" y="3" width="2" height="1"/>
<rect x="2" y="4" width="2" height="1"/><rect x="8" y="4" width="2" height="1"/>
<rect x="3" y="5" width="2" height="1"/><rect x="7" y="5" width="2" height="1"/>
<rect x="4" y="6" width="2" height="1"/><rect x="6" y="6" width="2" height="1"/>
<rect x="5" y="7" width="2" height="1"/>
</svg>
</div></body></html>
