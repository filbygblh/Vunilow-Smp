<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
body{background:#101010}
.wrap{position:relative;width:1024px;height:1024px;display:grid;place-items:center;overflow:hidden;
  background-image:url(../mc/stone.png);background-size:128px 128px;image-rendering:pixelated}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.44),rgba(0,0,0,.18) 42%,rgba(0,0,0,.5))}
.plate{position:absolute;inset:56px;border:4px solid #2a2a2a;box-shadow:inset 0 0 0 4px #0d0d0d}
.head{position:relative;width:600px;height:auto;image-rendering:pixelated;display:block;
  border:4px solid #2a2a2a;background:#0d0d0d;box-shadow:0 18px 0 rgba(0,0,0,.35)}
</style></head><body>
<div class="wrap">
  <div class="shade"></div>
  <div class="plate"></div>
  <img class="head" src="skin/head-1024.png" alt="">
</div></body></html>
