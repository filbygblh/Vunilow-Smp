<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:480px;overflow:hidden}
body{background:#0d0d0d;font-family:'Inter',system-ui,sans-serif}
.banner{position:relative;width:1200px;height:480px;display:flex;align-items:center;justify-content:center;gap:64px;padding:0 64px;box-sizing:border-box}
.ground{position:absolute;left:0;right:0;bottom:0;height:32px;background-image:url(../mc/grass_block_side.png);background-size:32px 32px;background-repeat:repeat-x;image-rendering:pixelated;border-top:2px solid #1c1c1c}
.copy{display:flex;flex-direction:column;z-index:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;padding:6px 12px;border-radius:2px;
  border:1px solid #33501f;background:#182410;color:#bfe59a;font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.chip i{width:8px;height:8px;background:#6fb14b;display:block}
h1{margin:12px 0 8px;font-size:76px;line-height:.94;font-weight:800;letter-spacing:-.045em;color:#f4f4f4}
.sub{margin:0;font-size:19px;font-weight:500;color:#a6a6a6}
.sub b{color:#e8e8e8;font-weight:600}
.cube{--s:152px;position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-38deg);flex:0 0 auto;z-index:1}
.cube i{position:absolute;inset:0;display:block;background-image:url(../mc/diamond_block.png);background-size:100% 100%;image-rendering:pixelated}
.cube i.f{transform:translateZ(calc(var(--s) / 2))}
.cube i.r{transform:rotateY(90deg) translateZ(calc(var(--s) / 2));filter:brightness(.7)}
.cube i.t{transform:rotateX(90deg) translateZ(calc(var(--s) / 2));filter:brightness(1.12)}
</style></head><body>
<div class="banner">
  <div class="ground"></div>
  <div class="copy">
    <span class="chip"><i></i>Minecraft · Live</span>
    <h1>VUNILOW</h1>
    <p class="sub"><b>Shop survival streams</b> · VunilowSMP</p>
  </div>
  <div class="cube"><i class="t"></i><i class="f"></i><i class="r"></i></div>
</div>
</body></html>
